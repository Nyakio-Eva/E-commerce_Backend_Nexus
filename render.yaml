services:
  # Web service (your Django API)
  - type: web
    name: ecommerce-api
    runtime: python3
    plan: free  # Change to 'starter' or higher for production
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn geocel.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ecommerce-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com,http://localhost:3000
      # Email settings (update with your values)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_HOST_USER
        sync: false  # Set this in Render dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: DEFAULT_FROM_EMAIL
        sync: false  # Set this in Render dashboard
    healthCheckPath: /api/docs/
    
  # PostgreSQL database
  - type: pserv
    name: ecommerce-db
    plan: free  # Change to 'starter' or higher for production
    databaseName: ecommerce_db
    user: ecommerce_user

  # Redis for caching (optional - remove if not needed)
  - type: redis
    name: ecommerce-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

