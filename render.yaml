services:
  - type: web
    name: ecommerce-api
    runtime: python3
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn geocel.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9  # Force Python 3.11 instead of 3.13
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: geocel-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: E-commerce_Backend_Nexus_API.onrender.com,localhost,127.0.0.1

databases:
  - name: geocel-db
    plan: free